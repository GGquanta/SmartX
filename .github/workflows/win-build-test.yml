name: Windows Build Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for SignPath parameter (e.g., 1.0.0-test.1)"
        required: false
        default: "dev"

permissions:
  contents: read
  actions: read

jobs:
  windows-build-sign:
    runs-on: windows-latest
    env:
      CI: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VITE_COMPANY_KNOWLEDGE_URL: ${{ vars.VITE_COMPANY_KNOWLEDGE_URL }}
      PROVIDER_DEFAULT_NAME: ${{ secrets.PROVIDER_DEFAULT_NAME }}
      PROVIDER_DEFAULT_APIKEY: ${{ secrets.PROVIDER_DEFAULT_APIKEY }}
      PROVIDER_DEFAULT_MODEL: ${{ secrets.PROVIDER_DEFAULT_MODEL }}
      PROVIDER_DEFAULT_BASE_URL: ${{ secrets.PROVIDER_DEFAULT_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install

      - name: Download uv binaries for Windows
        run: pnpm run uv:download:win

      - name: Download agent-browser binaries for Windows
        run: pnpm run agent-browser:download:win

      - name: Build Windows
        run: pnpm run package:win

      - name: Assert Windows x64 and arm64 installers
        shell: pwsh
        run: |
          $x64 = Get-ChildItem -Path "release" -Filter "*-win-x64.exe" -File
          $arm64 = Get-ChildItem -Path "release" -Filter "*-win-arm64.exe" -File
          if (-not $x64) { throw "Missing Windows x64 installer (release/*-win-x64.exe)" }
          if (-not $arm64) { throw "Missing Windows ARM64 installer (release/*-win-arm64.exe)" }
          Write-Host "Found x64: $($x64.Name)"
          Write-Host "Found arm64: $($arm64.Name)"

          $ymlFiles = Get-ChildItem -Path "release" -Filter "*.yml" -File | Where-Object { $_.Name -ne "builder-debug.yml" }
          if (-not $ymlFiles) { throw "No update manifest yml files found in release/" }
          $hasX64 = $false
          $hasArm64 = $false
          foreach ($yml in $ymlFiles) {
            $content = Get-Content $yml.FullName -Raw
            Write-Host "--- $($yml.Name) ---"
            Write-Host $content
            if ($content -match 'win-x64\.exe') { $hasX64 = $true }
            if ($content -match 'win-arm64\.exe') { $hasArm64 = $true }
          }
          if (-not $hasX64) { throw "Update manifest is missing win-x64.exe" }
          if (-not $hasArm64) { throw "Update manifest is missing win-arm64.exe" }

      - name: Validate unsigned Windows artifacts before SignPath
        shell: pwsh
        run: |
          $unsignedExeFiles = Get-ChildItem -Path "release" -Filter *.exe -File
          if (-not $unsignedExeFiles) {
            throw "No unsigned .exe files found in release/ before SignPath upload"
          }
          $unsignedCount = $unsignedExeFiles.Count
          "UNSIGNED_EXE_COUNT=$unsignedCount" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Found $unsignedCount unsigned .exe file(s):"
          $unsignedExeFiles | ForEach-Object { Write-Host " - $($_.Name)" }

      # Bypass GitHub connector (HTTP 503). Sign via SignPath REST SubmitWithArtifact.
      - name: Sign Windows artifacts via SignPath REST API
        id: signpath-sign-windows
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: "05aeab6b-bde4-460b-90e0-808d9f83779b"
          SIGNPATH_PROJECT_SLUG: "GGquanta"
          SIGNPATH_SIGNING_POLICY_SLUG: "GGquanta-sign"
        run: node scripts/signpath-sign-windows.mjs --input-dir release --output-dir release/signed --description "SmartX ${{ github.event.inputs.version || 'dev' }}"

      - name: Replace unsigned executables with signed ones
        shell: pwsh
        run: |
          $signedExeFiles = Get-ChildItem -Path "release/signed" -Filter *.exe -File -Recurse
          if (-not $signedExeFiles) {
            throw "No signed .exe files found in release/signed"
          }
          $signedCount = $signedExeFiles.Count
          if ($env:UNSIGNED_EXE_COUNT -and ($signedCount -ne [int]$env:UNSIGNED_EXE_COUNT)) {
            throw "Signed .exe count ($signedCount) does not match unsigned count ($env:UNSIGNED_EXE_COUNT)"
          }
          foreach ($file in $signedExeFiles) {
            Copy-Item -Path $file.FullName -Destination "release/$($file.Name)" -Force
          }
          $finalExeFiles = Get-ChildItem -Path "release" -Filter *.exe -File
          if ($env:UNSIGNED_EXE_COUNT -and ($finalExeFiles.Count -ne [int]$env:UNSIGNED_EXE_COUNT)) {
            throw "Final release .exe count ($($finalExeFiles.Count)) does not match unsigned count ($env:UNSIGNED_EXE_COUNT)"
          }
          Write-Host "Signed executables copied to release/ ($($finalExeFiles.Count) file(s))"

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-win-exe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/*.exe
            release/latest*.yml
          retention-days: 7
