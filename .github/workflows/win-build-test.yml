name: Windows Build Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the signed build (e.g., 1.0.0-test.1)"
        required: false
        default: "dev"

permissions:
  contents: read
  actions: read

jobs:
  windows-build-sign:
    runs-on: windows-latest
    env:
      CI: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VITE_COMPANY_KNOWLEDGE_URL: ${{ vars.VITE_COMPANY_KNOWLEDGE_URL }}
      PROVIDER_DEFAULT_NAME: ${{ secrets.PROVIDER_DEFAULT_NAME }}
      PROVIDER_DEFAULT_APIKEY: ${{ secrets.PROVIDER_DEFAULT_APIKEY }}
      PROVIDER_DEFAULT_MODEL: ${{ secrets.PROVIDER_DEFAULT_MODEL }}
      PROVIDER_DEFAULT_BASE_URL: ${{ secrets.PROVIDER_DEFAULT_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install

      - name: Download uv binaries for Windows
        run: pnpm run uv:download:win

      - name: Download agent-browser binaries for Windows
        run: pnpm run agent-browser:download:win

      - name: Build Windows (signed)
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "${WIN_CSC_LINK}" ] || [ -z "${WIN_CSC_KEY_PASSWORD}" ]; then
            echo "::error::Missing WIN_CSC_LINK or WIN_CSC_KEY_PASSWORD"
            exit 1
          fi
          echo "WIN_CSC_LINK length: ${#WIN_CSC_LINK}"
          pnpm run package:win

      - name: Assert Windows x64 and arm64 installers
        shell: pwsh
        run: |
          $x64 = Get-ChildItem -Path "release" -Filter "*-win-x64.exe" -File
          $arm64 = Get-ChildItem -Path "release" -Filter "*-win-arm64.exe" -File
          if (-not $x64) { throw "Missing Windows x64 installer (release/*-win-x64.exe)" }
          if (-not $arm64) { throw "Missing Windows ARM64 installer (release/*-win-arm64.exe)" }
          Write-Host "Found x64: $($x64.Name)"
          Write-Host "Found arm64: $($arm64.Name)"

          $ymlFiles = Get-ChildItem -Path "release" -Filter "*.yml" -File | Where-Object { $_.Name -ne "builder-debug.yml" }
          if (-not $ymlFiles) { throw "No update manifest yml files found in release/" }
          $hasX64 = $false
          $hasArm64 = $false
          foreach ($yml in $ymlFiles) {
            $content = Get-Content $yml.FullName -Raw
            Write-Host "--- $($yml.Name) ---"
            Write-Host $content
            if ($content -match 'win-x64\.exe') { $hasX64 = $true }
            if ($content -match 'win-arm64\.exe') { $hasArm64 = $true }
          }
          if (-not $hasX64) { throw "Update manifest is missing win-x64.exe" }
          if (-not $hasArm64) { throw "Update manifest is missing win-arm64.exe" }

      - name: Verify Windows Authenticode signature
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path "release" -Filter *.exe -File
          if (-not $exeFiles) { throw "No .exe files found in release/" }
          foreach ($exe in $exeFiles) {
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            Write-Host "$($exe.Name): Status=$($sig.Status) Subject=$($sig.SignerCertificate.Subject)"
            if (-not $sig.SignerCertificate) {
              throw "$($exe.Name) is not Authenticode-signed"
            }
            if ($sig.Status -eq 'NotSigned' -or $sig.Status -eq 'HashMismatch') {
              throw "$($exe.Name) signature status is $($sig.Status)"
            }
          }

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-win-exe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/*.exe
            release/latest*.yml
          retention-days: 7
