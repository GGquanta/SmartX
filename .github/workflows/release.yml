# SmartX Release Workflow
# Builds and publishes releases for macOS, Windows, and Linux
#
# Secrets (macOS code signing + notarization — required for stable mac builds):
#   CSC_LINK / MAC_CERTS                 — Developer ID Application .p12 (base64 or file:// / https URL)
#   CSC_KEY_PASSWORD / MAC_CERTS_PASSWORD — Password for the .p12
#   APPLE_API_KEY_ID                     — App Store Connect API Key ID (10 chars)
#   APPLE_API_ISSUER                     — App Store Connect Issuer ID (UUID)
#   APPLE_API_KEY_P8                     — Full contents of AuthKey_<KEY_ID>.p8
# Windows Authenticode (stable channel; electron-builder signs during package:win):
#   WIN_CSC_LINK                         — PKCS#12 (.pfx) as base64 (no newlines)
#   WIN_CSC_KEY_PASSWORD                 — Password for the .pfx
# Generate a private cert: scripts/generate-win-codesign-cert.sh
# Fallback (legacy Apple ID notarization, used only if API key secrets are absent):
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
#
# Prepare CSC_LINK on a Mac with the certificate installed:
#   security find-identity -v -p codesigning
#   # Export "Developer ID Application" from Keychain Access as .p12, then:
#   base64 -i DeveloperID.p12 | pbcopy

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
      internal_release:
        description: '内网测试：跳过 mac 签名/公证与 Windows Authenticode（tag 含 alpha/beta/rc/internal 时也会自动启用）'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   PUBLISH_GITHUB_RELEASE — set to 'true' to run publish + finalize (GitHub Releases); unset/false skips
#   OSS_BUCKET   — OSS bucket name (default: ggquanta-smartx)
#   OSS_ENDPOINT — ossutil endpoint (e.g. oss-cn-hongkong.aliyuncs.com)
env:
  OSS_BUCKET: ${{ vars.OSS_BUCKET || 'ggquanta-smartx' }}
  OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}

jobs:
  # Fails fast on tag pushes if package.json "version" does not match the tag.
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Assert tag matches package.json
        run: node scripts/assert-tag-matches-package.mjs

  release:
    needs: validate-release
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    env:
      VITE_COMPANY_KNOWLEDGE_URL: ${{ vars.VITE_COMPANY_KNOWLEDGE_URL }}
      PROVIDER_DEFAULT_NAME: ${{ secrets.PROVIDER_DEFAULT_NAME }}
      PROVIDER_DEFAULT_APIKEY: ${{ secrets.PROVIDER_DEFAULT_APIKEY }}
      PROVIDER_DEFAULT_MODEL: ${{ secrets.PROVIDER_DEFAULT_MODEL }}
      PROVIDER_DEFAULT_BASE_URL: ${{ secrets.PROVIDER_DEFAULT_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Windows release jobs exhaust disk after Electron packaging; skip pnpm cache
      # save in Post Setup Node.js (tar+zstd) to avoid post-job cleanup failures.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: ${{ matrix.platform != 'win' && 'pnpm' || '' }}

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install

      - name: Download uv binaries for macOS
        if: matrix.platform == 'mac'
        run: pnpm run uv:download:mac

      - name: Download uv binaries for Windows
        if: matrix.platform == 'win'
        run: pnpm run uv:download:win

      - name: Download uv binaries for Linux
        if: matrix.platform == 'linux'
        run: pnpm run uv:download:linux

      - name: Download agent-browser binaries for macOS
        if: matrix.platform == 'mac'
        run: pnpm run agent-browser:download:mac

      - name: Download agent-browser binaries for Windows
        if: matrix.platform == 'win'
        run: pnpm run agent-browser:download:win

      - name: Download agent-browser binaries for Linux
        if: matrix.platform == 'linux'
        run: pnpm run agent-browser:download:linux

      # Internal: unsigned mac + unsigned Windows. Stable: Apple notarize + Windows Authenticode.
      - name: Detect release channel
        id: release-channel
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="${{ github.event.inputs.version }}"
          fi
          INTERNAL=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.internal_release }}" == "true" ]]; then
            INTERNAL=true
          fi
          if [[ "$TAG" =~ (alpha|beta|rc|internal) ]]; then
            INTERNAL=true
          fi
          if [[ "$INTERNAL" == "true" ]]; then
            echo "is_internal=true" >> $GITHUB_OUTPUT
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "Channel: internal ($TAG) — skip mac signing/notarize and Windows Authenticode"
          else
            echo "is_internal=false" >> $GITHUB_OUTPUT
            echo "is_stable=true" >> $GITHUB_OUTPUT
            echo "Channel: stable ($TAG) — mac notarize + Windows Authenticode"
          fi

      # macOS specific steps
      - name: Free disk space (macOS)
        if: matrix.platform == 'mac'
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          # Remove large pre-installed toolchains not needed for Electron builds
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/node_modules || true
          rm -rf ~/Library/Caches/electron-builder/dmg-builder* || true
          # Homebrew cleanup
          brew cleanup --prune=all 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h /

      # --publish never: prevent electron-builder from auto-publishing to GitHub.
      # All artifacts are collected and published atomically in the publish job.
      - name: Build macOS (internal, unsigned)
        if: matrix.platform == 'mac' && steps.release-channel.outputs.is_internal == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ulimit -n 65536
          echo "File descriptor limit: $(ulimit -n)"
          pnpm run package:mac:internal

      - name: Prepare Apple notarization API key
        if: matrix.platform == 'mac' && steps.release-channel.outputs.is_internal != 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK || secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD || secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "${CSC_LINK}" ] || [ -z "${CSC_KEY_PASSWORD}" ]; then
            echo "::error::Missing CSC_LINK/MAC_CERTS or CSC_KEY_PASSWORD/MAC_CERTS_PASSWORD"
            exit 1
          fi

          if [ -n "${APPLE_API_KEY_P8}" ]; then
            missing=0
            for name in APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_P8; do
              if [ -z "${!name}" ]; then
                echo "::error::Missing required secret: ${name}"
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              exit 1
            fi

            KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "${APPLE_API_KEY_P8}" > "${KEY_PATH}"
            [[ "$(tail -c1 "${KEY_PATH}" | wc -l)" -eq 0 ]] && printf '\n' >> "${KEY_PATH}"
            chmod 600 "${KEY_PATH}"
            echo "APPLE_API_KEY=${KEY_PATH}" >> "$GITHUB_ENV"
            echo "Wrote App Store Connect API key to ${KEY_PATH}"

            echo "=== Preflight: notarytool auth ==="
            xcrun notarytool history \
              --key "${KEY_PATH}" \
              --key-id "${APPLE_API_KEY_ID}" \
              --issuer "${APPLE_API_ISSUER}" || {
                echo "::error::notarytool auth failed — check APPLE_API_KEY_P8 / KEY_ID / ISSUER"
                exit 1
              }
          elif [ -n "${APPLE_ID}" ]; then
            echo "::warning::APPLE_API_KEY_P8 is unset; falling back to Apple ID notarization"
          else
            echo "::error::Configure APPLE_API_KEY_P8 / APPLE_API_KEY_ID / APPLE_API_ISSUER (preferred) or APPLE_ID"
            exit 1
          fi

      - name: Build macOS (signed + notarized)
        if: matrix.platform == 'mac' && steps.release-channel.outputs.is_internal != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK || secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD || secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEBUG: electron-builder,electron-osx-sign
        run: |
          ulimit -n 65536
          echo "File descriptor limit: $(ulimit -n)"
          echo "CSC_LINK length: ${#CSC_LINK}"
          echo "APPLE_API_KEY: ${APPLE_API_KEY:-<unset>}"
          echo "APPLE_API_KEY_ID: ${APPLE_API_KEY_ID:-<unset>}"
          pnpm run package:mac

      - name: Verify macOS signature and notarization
        if: matrix.platform == 'mac' && steps.release-channel.outputs.is_internal != 'true'
        run: |
          set -euo pipefail
          APP_PATH="$(find release -name 'SmartX.app' -not -path '*/Frameworks/*' -print | head -n 1 || true)"
          DMG_PATH="$(find release -maxdepth 1 -name '*-mac-*.dmg' -print | head -n 1 || true)"

          if [ -z "${APP_PATH}" ] && [ -n "${DMG_PATH}" ]; then
            MOUNT_POINT="$(mktemp -d)"
            hdiutil attach "${DMG_PATH}" -nobrowse -readonly -mountpoint "${MOUNT_POINT}"
            APP_PATH="$(find "${MOUNT_POINT}" -maxdepth 1 -name 'SmartX.app' -print | head -n 1)"
            cleanup() { hdiutil detach "${MOUNT_POINT}" -quiet || true; rm -rf "${MOUNT_POINT}"; }
            trap cleanup EXIT
          fi

          if [ -z "${APP_PATH}" ]; then
            echo "::error::No SmartX.app found to verify after macOS build"
            ls -laR release || true
            exit 1
          fi

          node scripts/mac-signing-env.mjs verify "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}" || echo "::warning::stapler validate failed (notarize ticket may still be pending)"
          spctl --assess --type execute --verbose "${APP_PATH}" || {
            echo "::warning::spctl assess reported a warning (codesign already verified)"
          }

      # Windows specific steps
      - name: Free disk space (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Write-Host "=== Disk usage before cleanup ==="
          Get-PSDrive -Name C | Format-List Used,Free
          $paths = @(
            "C:\Android",
            "$env:ProgramFiles\Android",
            "$env:ProgramFiles\dotnet",
            "C:\hostedtoolcache\windows\CodeQL",
            "C:\hostedtoolcache\windows\go",
            "C:\hostedtoolcache\windows\Java",
            "C:\hostedtoolcache\windows\Ruby"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Removing $p"
              cmd /c "rmdir /s /q `"$p`""
            }
          }
          Write-Host "=== Disk usage after cleanup ==="
          Get-PSDrive -Name C | Format-List Used,Free

      - name: Build Windows (internal, unsigned)
        if: matrix.platform == 'win' && steps.release-channel.outputs.is_internal == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run package:win

      - name: Build Windows (signed)
        if: matrix.platform == 'win' && steps.release-channel.outputs.is_internal != 'true'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "${WIN_CSC_LINK}" ] || [ -z "${WIN_CSC_KEY_PASSWORD}" ]; then
            echo "::error::Missing WIN_CSC_LINK or WIN_CSC_KEY_PASSWORD"
            exit 1
          fi
          echo "WIN_CSC_LINK length: ${#WIN_CSC_LINK}"
          pnpm run package:win

      - name: Assert Windows x64 and arm64 installers
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $x64 = Get-ChildItem -Path "release" -Filter "*-win-x64.exe" -File
          $arm64 = Get-ChildItem -Path "release" -Filter "*-win-arm64.exe" -File
          if (-not $x64) { throw "Missing Windows x64 installer (release/*-win-x64.exe)" }
          if (-not $arm64) { throw "Missing Windows ARM64 installer (release/*-win-arm64.exe)" }
          Write-Host "Found x64: $($x64.Name)"
          Write-Host "Found arm64: $($arm64.Name)"

          $ymlFiles = Get-ChildItem -Path "release" -Filter "*.yml" -File | Where-Object { $_.Name -ne "builder-debug.yml" }
          if (-not $ymlFiles) { throw "No update manifest yml files found in release/" }
          $hasX64 = $false
          $hasArm64 = $false
          foreach ($yml in $ymlFiles) {
            $content = Get-Content $yml.FullName -Raw
            Write-Host "--- $($yml.Name) ---"
            Write-Host $content
            if ($content -match 'win-x64\.exe') { $hasX64 = $true }
            if ($content -match 'win-arm64\.exe') { $hasArm64 = $true }
          }
          if (-not $hasX64) { throw "Update manifest is missing win-x64.exe" }
          if (-not $hasArm64) { throw "Update manifest is missing win-arm64.exe" }

      - name: Verify Windows Authenticode signature
        if: matrix.platform == 'win' && steps.release-channel.outputs.is_stable == 'true'
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path "release" -Filter *.exe -File
          if (-not $exeFiles) { throw "No .exe files found in release/" }
          foreach ($exe in $exeFiles) {
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            Write-Host "$($exe.Name): Status=$($sig.Status) Subject=$($sig.SignerCertificate.Subject)"
            if (-not $sig.SignerCertificate) {
              throw "$($exe.Name) is not Authenticode-signed"
            }
            if ($sig.Status -eq 'NotSigned' -or $sig.Status -eq 'HashMismatch') {
              throw "$($exe.Name) signature status is $($sig.Status)"
            }
          }

      # Linux specific steps
      - name: Build Linux
        if: matrix.platform == 'linux'
        run: pnpm run package:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.yml
            !release/builder-debug.yml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job: Publish to GitHub Releases
  # ──────────────────────────────────────────────────────────────
  publish:
    needs: release
    if: ${{ vars.PUBLISH_GITHUB_RELEASE == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts only
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*

      - name: List all downloaded artifacts
        run: |
          echo "=== All artifacts downloaded ==="
          find release-artifacts/ -type f -exec ls -lh {} \;
          echo ""
          echo "=== File tree ==="
          tree release-artifacts/ || find release-artifacts/ -print

      - name: Remove duplicate builder-debug files
        run: |
          echo "Removing builder-debug.yml files to avoid duplicate asset upload conflicts..."
          find release-artifacts/ -name "builder-debug.yml" -delete -print || true

      - name: Create GitHub Release (as pre-release)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.yml
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            ## 🚀 SmartX ${{ github.ref_name }}
            
            SmartX - Graphical AI Assistant based on OpenClaw
            
            ### 📦 Downloads
            
            Please select the appropriate installer for your operating system and architecture:
            
            #### macOS
            - **Apple Silicon (M1/M2/M3/M4)**: `SmartX-*-mac-arm64.dmg`
            - **Intel (x64)**: `SmartX-*-mac-x64.dmg`
            
            #### Windows
            - **Installer (x64)**: `SmartX-*-win-x64.exe`
            - **Installer (ARM64)**: `SmartX-*-win-arm64.exe`
            
            #### Linux
            - **AppImage (x64)**: `SmartX-*-linux-x86_64.AppImage` (Universal format, recommended)
            - **AppImage (ARM64)**: `SmartX-*-linux-arm64.AppImage`
            - **Debian/Ubuntu (x64)**: `SmartX-*-linux-amd64.deb`
            - **Debian/Ubuntu (ARM64)**: `SmartX-*-linux-arm64.deb`
            - **RPM (x64)**: `SmartX-*-linux-x86_64.rpm`
            
            ### 📝 Release Notes
            
            See the auto-generated release notes below for detailed changes.
            
            ### ⚠️ Installation Notes
            
            - **macOS**: On first launch, you may see "cannot verify developer". Go to System Preferences → Security & Privacy to allow the app to run
            - **Windows**: SmartScreen may block the app. Click "More info" → "Run anyway" to proceed
            - **Linux AppImage**: First run `chmod +x SmartX-*.AppImage` to add execute permission. On Ubuntu 22.04 you may also need `sudo apt install libfuse2`; on Ubuntu 24.04 use `sudo apt install libfuse2t64`
            - **Linux .deb (Ubuntu 24.04)**: If installation fails due to missing dependencies, use `sudo apt install libgtk-3-0t64 libnotify4t64 libxss1t64` before installing
            
            ---
            
            💬 Found an issue? Please submit an [Issue](https://github.com/${{ github.repository }}/issues)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # Job: Upload to Alibaba Cloud OSS
  # Uploads all release artifacts to OSS for:
  #   - Official website downloads (via release-info.json)
  #   - electron-updater auto-update (via {channel}-*.yml)
  #
  # Directory structure on OSS (channel-separated):
  #   latest/          → stable releases (latest.yml, latest-mac.yml, …)
  #   alpha/           → alpha  releases (alpha.yml,  alpha-mac.yml, …)
  #   beta/            → beta   releases (beta.yml,   beta-mac.yml,  …)
  #   releases/vX.Y.Z/ → permanent archive, never deleted
  # ──────────────────────────────────────────────────────────────
  upload-oss:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts only
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*

      - name: Extract version and channel
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi

          # Detect channel from semver prerelease tag
          # e.g. 0.1.8-alpha.0 → alpha, 1.0.0-beta.1 → beta, 1.0.0 → latest
          if [[ "$VERSION" =~ -([a-zA-Z]+) ]]; then
            CHANNEL="${BASH_REMATCH[1]}"
          else
            CHANNEL="latest"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}, channel: ${CHANNEL}"

      - name: Prepare upload directories
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          CHANNEL="${{ steps.version.outputs.channel }}"

          mkdir -p staging/${CHANNEL}
          mkdir -p staging/releases/${TAG}

          # Flatten all platform artifacts into staging directories
          find release-artifacts/ -type f | while read file; do
            filename=$(basename "$file")
            cp "$file" "staging/${CHANNEL}/${filename}"
            cp "$file" "staging/releases/${TAG}/${filename}"
          done

          echo "=== staging/${CHANNEL}/ ==="
          ls -lh staging/${CHANNEL}/
          echo ""
          echo "=== staging/releases/${TAG}/ ==="
          ls -lh staging/releases/${TAG}/

      # Note: Do NOT rename yml files. electron-updater (generic provider) always
      # requests "latest-mac.yml", "latest.yml", etc. regardless of feed URL.
      # Channel separation is achieved by directory: /alpha/, /beta/, /latest/.
      - name: Verify yml files present
        run: |
          CHANNEL="${{ steps.version.outputs.channel }}"
          echo "=== staging/${CHANNEL}/ (update metadata) ==="
          ls -la staging/${CHANNEL}/*.yml 2>/dev/null || echo "No yml files found (check electron-builder outputs)"

      - name: Generate release-info.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.version.outputs.channel }}"
          BASE_URL="https://smartx.qubitlab.cc/${CHANNEL}"

          jq -n \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "$BASE_URL" \
            --arg changelog "https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" \
            '{
              version: $version,
              channel: $channel,
              releaseDate: $date,
              downloads: {
                mac: {
                  x64: ($base + "/SmartX-" + $version + "-mac-x64.dmg"),
                  arm64: ($base + "/SmartX-" + $version + "-mac-arm64.dmg")
                },
                win: {
                  x64: ($base + "/SmartX-" + $version + "-win-x64.exe"),
                  arm64: ($base + "/SmartX-" + $version + "-win-arm64.exe")
                },
                linux: {
                  deb_amd64: ($base + "/SmartX-" + $version + "-linux-amd64.deb"),
                  deb_arm64: ($base + "/SmartX-" + $version + "-linux-arm64.deb"),
                  appimage_x64: ($base + "/SmartX-" + $version + "-linux-x86_64.AppImage"),
                  appimage_arm64: ($base + "/SmartX-" + $version + "-linux-arm64.AppImage"),
                  rpm_x64: ($base + "/SmartX-" + $version + "-linux-x86_64.rpm")
                }
              },
              changelog: $changelog
            }' > staging/${CHANNEL}/release-info.json

          echo "=== release-info.json ==="
          cat staging/${CHANNEL}/release-info.json

      - name: Install and configure ossutil
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ env.OSS_ENDPOINT }}
        run: |
          if [ -z "${OSS_ENDPOINT}" ]; then
            echo "::error::OSS_ENDPOINT repository variable is not set"
            exit 1
          fi

          curl -sL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

          # Write config file for non-interactive use
          cat > $HOME/.ossutilconfig << EOF
          [Credentials]
          language=EN
          endpoint=${OSS_ENDPOINT}
          accessKeyID=${OSS_ACCESS_KEY_ID}
          accessKeySecret=${OSS_ACCESS_KEY_SECRET}
          EOF

          ossutil --version

      - name: "Upload to OSS: {channel}/ (overwrite)"
        run: |
          CHANNEL="${{ steps.version.outputs.channel }}"

          # Overwrite same-name objects in-place (-f). Do not rm the prefix first:
          # the CI OSS principal may lack DeleteObject ACL on this bucket.
          ossutil cp -r -f \
            --meta="Cache-Control:no-cache,no-store,must-revalidate" \
            staging/${CHANNEL}/ \
            oss://${{ env.OSS_BUCKET }}/${CHANNEL}/

          echo "Uploaded to ${CHANNEL}/"

      - name: "Upload to OSS: releases/vX.Y.Z/ (archive)"
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          # -f: overwrite existing archive objects (re-runs / hotfix re-uploads)
          ossutil cp -r -f \
            staging/releases/${TAG}/ \
            oss://${{ env.OSS_BUCKET }}/releases/${TAG}/ \
            --meta "Cache-Control:public,max-age=31536000,immutable"

          echo "Uploaded to releases/${TAG}/"

      - name: Verify OSS upload
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          CHANNEL="${{ steps.version.outputs.channel }}"

          echo "=== ${CHANNEL}/ ==="
          ossutil ls oss://${{ env.OSS_BUCKET }}/${CHANNEL}/ --short

          echo ""
          echo "=== releases/${TAG}/ ==="
          ossutil ls oss://${{ env.OSS_BUCKET }}/releases/${TAG}/ --short

          echo ""
          echo "=== Verify release-info.json ==="
          ossutil cp oss://${{ env.OSS_BUCKET }}/${CHANNEL}/release-info.json /tmp/release-info.json -f
          jq . /tmp/release-info.json

          echo ""
          echo "=== Verify update yml ==="
          if [ "${CHANNEL}" = "latest" ]; then
            YML_PREFIX="latest"
          else
            YML_PREFIX="${CHANNEL}"
          fi
          echo "electron-updater expects ${YML_PREFIX}-mac.yml, ${YML_PREFIX}.yml, etc. in ${CHANNEL}/:"
          ossutil ls oss://${{ env.OSS_BUCKET }}/${CHANNEL}/ --short | grep "${YML_PREFIX}.*\\.yml" || echo "(none found)"
          
          echo ""
          echo "All files uploaded and verified successfully!"

  # ──────────────────────────────────────────────────────────────
  # Job: Finalize Release
  # Promotes the GitHub Release from pre-release to latest AFTER
  # both GitHub Release assets and OSS uploads are fully complete.
  # This ensures /releases/latest API never returns an incomplete
  # release — the website and electron-updater only see it when
  # all platform artifacts are ready.
  # ──────────────────────────────────────────────────────────────
  finalize:
    needs: [publish, upload-oss]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Promote release from pre-release to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          IS_PRERELEASE_CHANNEL=false

          if [[ "$TAG" == *"alpha"* ]] || [[ "$TAG" == *"beta"* ]]; then
            IS_PRERELEASE_CHANNEL=true
          fi

          if [ "$IS_PRERELEASE_CHANNEL" = "true" ]; then
            echo "Tag $TAG is an alpha/beta release — keeping as pre-release."
          else
            echo "Promoting $TAG from pre-release to latest release..."
            gh release edit "$TAG" \
              --prerelease=false \
              --latest \
              --repo "${{ github.repository }}"
            echo "Release $TAG is now the latest release."
          fi
